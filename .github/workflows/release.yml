# Release pipeline (review R1): builds a signed source artifact for every
# vX.Y.Z tag and publishes it as a GitHub release. The self-updater refuses
# releases whose SHA256SUMS / signature assets are missing or invalid, so
# this workflow is the ONLY supported release path.
#
# Trust model:
# - The artifact is a byte-stable `git archive` tarball (NOT GitHub's
#   auto-generated one, which is not guaranteed to be reproducible).
# - SHA256SUMS is signed with Ed25519; the private key lives only in the
#   BROKE_RELEASE_SIGNING_KEY repository secret. The updater embeds the
#   matching public key and verifies signature + checksum before extracting.
#
# Deliberately dependency-free (no third-party actions beyond checkout /
# setup-node): every extra action would widen the supply-chain surface this
# workflow exists to close.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the source artifact (byte-stable git archive)
        run: git archive --format=tar.gz --output="broke-${{ github.ref_name }}.tar.gz" "${{ github.ref_name }}"

      - name: Sign SHA256SUMS
        env:
          BROKE_RELEASE_SIGNING_KEY: ${{ secrets.BROKE_RELEASE_SIGNING_KEY }}
        run: node scripts/sign-release.mjs "broke-${{ github.ref_name }}.tar.gz"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "broke-${{ github.ref_name }}.tar.gz" \
            SHA256SUMS \
            SHA256SUMS.sig \
            --verify-tag \
            --title "${{ github.ref_name }}" \
            --generate-notes
