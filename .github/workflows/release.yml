# Release pipeline (BRK-007/BRK-008 rework): a tag push only TRIGGERS the
# release - the heavyweight decisions live in workflows this tag cannot
# alter:
#
# 1. `gate` runs the FULL CI suite (CodeQL, UI validation, deploy smokes,
#    deps-current, typecheck, tests, audit) on the exact tagged commit via
#    the reusable ci.yml workflow (same ref).
# 2. `sign-and-publish` calls the reusable release-sign-and-publish workflow
#    PINNED TO `main`: the signing code that receives
#    BROKE_RELEASE_SIGNING_KEY comes from protected main, never from the
#    tag (BRK-008 - the signing key is no longer in the trust area of the
#    tag). The environment `release` still requires the maintainer approval
#    BEFORE any secret is exposed. The workflow additionally verifies that
#    the tag is an ancestor of protected main.
#
# Trust model:
# - The artifact is a byte-stable `git archive` tarball of the tagged commit,
#   built by the trusted workflow.
# - SHA256SUMS is signed with Ed25519; the private key lives only in the
#   BROKE_RELEASE_SIGNING_KEY repository secret and is only ever touched by
#   code checked out from protected main.
# - The self-updater refuses releases whose SHA256SUMS / signature assets
#   are missing or invalid, so this pipeline remains the ONLY supported
#   release path.
# - Least privilege: the caller's token CAPS the callee's - the full gate
#   (CodeQL) needs security-events:write and the publish job needs
#   contents:write, so both are granted here; every local/called job then
#   narrows to what it actually uses (ci.yml's jobs opt in individually).

name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  security-events: write

jobs:
  gate:
    name: Full CI gate (tagged commit)
    uses: ./.github/workflows/ci.yml

  sign-and-publish:
    name: Sign and publish (main-controlled, approval-gated)
    needs: [gate]
    uses: 777marvin/ext-broke/.github/workflows/release-sign-and-publish.yml@main
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
