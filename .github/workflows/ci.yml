name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reused by the release workflow as its pre-signature gate (review F-03):
  # the exact tagged commit must pass the full CI/security suite before
  # anything is signed or published.
  workflow_call:

# Least privilege: jobs opt in to the permissions they actually need.
permissions:
  contents: read

jobs:
  test:
    name: Typecheck & tests (Node ${{ matrix.node }})
    # BRK-026: run the suite on the MINIMUM supported Node (22, the engines
    # floor) AND current LTS (24). @types/node tracks a newer major, so the
    # typecheck alone can pass on APIs Node 22 does not have - only a real
    # 22 run proves the floor.
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      # fetch-tags: check:version verifies the release tag at HEAD when this
      # workflow runs on a release commit (direct push or workflow_call from
      # the release workflow) - without tags the exact-version gate fails.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check:version
      - run: npm run typecheck
      - run: npm test

  coverage:
    name: Coverage gate (branch thresholds, critical modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # BRK-026: line coverage hid weak BRANCH coverage of the central
      # orchestrator. Per-file branch gates on the critical modules -
      # thresholds sit slightly under the measured baseline (compress 85.3,
      # indexer 86.1, update 76.0, index 62.9) so regressions fail the gate.
      - run: npm run coverage

  ui-validation:
    name: Extension UI component validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:ui

  audit:
    name: Dependency audit (high & critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  deps-current:
    name: Typecheck & tests against latest @aiderdesk/extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install @aiderdesk/extensions@latest
      - run: npm run typecheck
      - run: npm test

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: javascript-typescript
      - name: Autobuild
        uses: github/codeql-action/autobuild@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  deploy-script:
    name: deploy.ps1 standalone smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Smoke-test deploy.ps1 in standalone mode
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:USERPROFILE = $env:HOME
          # Standalone mode: <repo>/extensions/<name> does not exist, so the
          # script must fall back to deploying the repo itself. Dry run on a
          # clean tree must succeed.
          ./scripts/deploy.ps1 -Category extensions -Name smoke-nonexistent -DryRun
          if ($LASTEXITCODE -ne 0) { throw 'deploy.ps1 standalone dry run failed' }
          Write-Output 'deploy.ps1 standalone smoke test passed.'

  deploy-script-windows:
    name: deploy.ps1 standalone smoke test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Smoke-test deploy.ps1 in standalone mode
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/deploy.ps1 -Category extensions -Name smoke-nonexistent -DryRun
          if ($LASTEXITCODE -ne 0) { throw 'deploy.ps1 standalone dry run failed' }
          Write-Output 'deploy.ps1 standalone smoke test passed.'

  deploy-secret-filter:
    name: deploy.ps1 excludes nested secrets (regression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Real deploy against a temp profile; nested secrets must not reach the target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:USERPROFILE = Join-Path $env:HOME 'broke-ci-profile'
          if (Test-Path $env:USERPROFILE) { Remove-Item $env:USERPROFILE -Recurse -Force }
          # Attack fixtures: secrets nested inside subdirectories of a dirty
          # working tree (-Force allows the deploy despite the untracked files).
          New-Item -ItemType Directory -Force -Path 'examples', 'fixtures' | Out-Null
          Set-Content -Path 'examples/.env' -Value 'SECRET=<redacted-secret>'
          Set-Content -Path 'examples/client.key' -Value '-----BEGIN PRIVATE KEY-----'
          Set-Content -Path 'fixtures/private.pem' -Value '-----BEGIN CERTIFICATE-----'
          Set-Content -Path 'examples/debug.log' -Value 'debug data'
          try {
            ./scripts/deploy.ps1 -Category extensions -Name secret-smoke -Force
            if ($LASTEXITCODE -ne 0) { throw 'deploy.ps1 failed' }
            $target = Join-Path $env:USERPROFILE '.aider-desk/extensions/secret-smoke'
            foreach ($forbidden in @('examples/.env', 'examples/client.key', 'fixtures/private.pem', 'examples/debug.log')) {
              if (Test-Path (Join-Path $target $forbidden)) { throw "nested secret was deployed: $forbidden" }
            }
            if (-not (Test-Path (Join-Path $target 'package.json'))) { throw 'deploy lost the repo content' }
            if (-not (Test-Path (Join-Path $target 'docs/overview.md'))) { throw 'deploy over-filtered legit nested content' }
            Write-Output 'nested secret filter verified.'
          }
          finally {
            Remove-Item -Path 'examples/.env', 'examples/client.key', 'fixtures/private.pem', 'examples/debug.log' -Force -ErrorAction SilentlyContinue
            Remove-Item -Path $env:USERPROFILE -Recurse -Force -ErrorAction SilentlyContinue
          }
