<!doctype html>
<html

>

    <meta charset="UTF-8" />

        width: 1920px;

        position: relative;

        overflow: hidden;
        background: #0a0c0b;

      #pipeline { position: absolute; inset: 0; }
    </style>

    <div data-hf-id="hf-199x"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div data-hf-id="hf-6fz8"
        id="pipeline"
        class="clip"
        data-composition-id="pipeline"
        data-composition-src="compositions/pipeline.html"
        data-start="0"
        data-duration="10"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines.main = gsap.timeline({ paused: true });
    </script>
